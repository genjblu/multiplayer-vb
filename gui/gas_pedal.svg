<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <linearGradient id="pedalMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4453"/>
      <stop offset="50%" stop-color="#212732"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00aa22"/>
    </linearGradient>
  </defs>

  <!-- Pedal Base Plate -->
  <rect x="14" y="8" width="72" height="144" rx="14" fill="url(#pedalMetal)" stroke="#39ff14" stroke-width="3"/>
  <rect x="18" y="12" width="64" height="136" rx="11" fill="none" stroke="#2a323d" stroke-width="2"/>

  <!-- Rubber Grip Slots -->
  <rect x="26" y="28" width="48" height="10" rx="5" fill="#0d1117" stroke="#39ff14" stroke-width="1.5"/>
  <rect x="26" y="48" width="48" height="10" rx="5" fill="#0d1117" stroke="#39ff14" stroke-width="1.5"/>
  <rect x="26" y="68" width="48" height="10" rx="5" fill="#0d1117" stroke="#39ff14" stroke-width="1.5"/>
  <rect x="26" y="88" width="48" height="10" rx="5" fill="#0d1117" stroke="#39ff14" stroke-width="1.5"/>
  <rect x="26" y="108" width="48" height="10" rx="5" fill="#0d1117" stroke="#39ff14" stroke-width="1.5"/>
  <rect x="26" y="128" width="48" height="10" rx="5" fill="#0d1117" stroke="#39ff14" stroke-width="1.5"/>

  <!-- Upward Accelerator Arrow Indicator -->
  <polygon points="50,16 62,26 38,26" fill="url(#neonGreen)"/>
</svg>
